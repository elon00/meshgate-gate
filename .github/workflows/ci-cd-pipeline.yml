name: Offline mesh topology regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail-closed Python compilation
        run: python -m compileall -q src tests
      - name: Real offline topology and negative regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rust format
        run: cargo fmt --check
      - name: Rust compilation (no external dependencies)
        run: cargo check
